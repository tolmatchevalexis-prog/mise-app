<!doctype html>
<html lang="fr">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#111111">

<meta
  name="description"
  content="M.I.S.E. — Fiche de jeu"
>

<title>M.I.S.E. — En jeu</title>

<link rel="stylesheet" href="style.css">

<style>

/* ==========================================
   CARTOUCHES DE LA FICHE DE JEU
   ========================================== */

.game-cards {
  display: grid;
  gap: 12px;
  margin: 8px 0 20px;
}

.game-card {
  padding: 16px 18px;
  border: 1.5px solid #ffffff;
  border-radius: 12px;
  background: #111111;
  color: #ffffff;
  overflow-wrap: anywhere;
}

.game-card-title {
  margin: 0 0 6px;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 16px;
  font-weight: 700;
}

.game-card-meta {
  margin: 0;
  font-size: 14px;
  line-height: 1.5;
}

.game-card-description {
  margin: 10px 0 0;
  font-size: 14px;
  line-height: 1.5;
  white-space: pre-wrap;
}

.game-card-button {
  display: block;
  width: 100%;
  margin-top: 14px;
  padding: 12px 14px;

  border: 1.5px solid #ffffff;
  border-radius: 9px;

  background: #ffffff;
  color: #111111;

  font-family: Arial, Helvetica, sans-serif;
  font-size: 15px;
  font-weight: 700;
}

.game-card-button:disabled {
  opacity: 0.35;
}

.game-empty {
  margin: 8px 0 18px;
  font-size: 14px;
}

</style>

</head>

<body class="game-page">

<main class="app">

<section id="game">

  <!-- EN-TÊTE -->

  <div class="heading">

    <button
      class="back"
      id="back"
      type="button"
      aria-label="Retour à la fiche du personnage"
    >
      ←
    </button>

    <h1>M.I.S.E.</h1>

  </div>


  <!-- PERSONNAGE -->

  <div
    class="detail-name"
    id="character-name"
  ></div>


  <!-- ATTRIBUTS -->

  <h2>Attributs</h2>

  <div id="attributes"></div>


  <!-- RÉSERVES -->

  <h2>Réserves de PA</h2>

  <div id="reserves"></div>


  <!-- ACTIONS DE JEU -->

  <div class="actions group">

    <button
      class="box primary"
      id="open-action"
      type="button"
    >
      Miser contre un SD
    </button>

    <button
      class="box primary"
      id="open-opposition"
      type="button"
    >
      Résoudre une opposition
    </button>

  </div>


  <!-- BLESSURES -->

  <h2>Blessures</h2>

  <p class="subtle">
    Chaque blessure réduit de 3 PA
    le maximum de la réserve concernée.
  </p>

  <div id="wounds"></div>


  <!-- COMPÉTENCES -->

  <h2>Compétences</h2>

  <div
    class="game-cards"
    id="skills"
  ></div>


  <!-- ATOUTS -->

  <h2>Atouts</h2>

  <div
    class="game-cards"
    id="atouts"
  ></div>

  <p
    class="subtle"
    id="atout-result"
    role="status"
    aria-live="polite"
  ></p>


  <!-- NAVIGATION -->

  <div class="actions group">

    <button
      class="box secondary"
      id="exit"
      type="button"
    >
      Quitter le mode jeu
    </button>

  </div>

</section>

</main>


<script>

(() => {

"use strict";


/* ==========================================
   CONFIGURATION
   ========================================== */

const $ = id =>
  document.getElementById(id);

const KEY = "mise-app-characters-v1";

const ATTRS = [
  "physique",
  "mental",
  "social"
];

const ATTR_NAMES = {
  physique: "Physique",
  mental: "Mental",
  social: "Social"
};

const RESERVES = {
  physique: "Vigueur",
  mental: "Volonté",
  social: "Influence"
};

const LEVELS = [
  "Novice",
  "Confirmé",
  "Expert",
  "Maître"
];

const BONUSES = [1, 2, 3, 5];

const clamp = (value, min, max) =>
  Math.max(min, Math.min(max, value));

const baseMax = attribute =>
  attribute * 3 + 5;


/* ==========================================
   CHARGEMENT DES PERSONNAGES
   ========================================== */

let characters = [];

try {

  const stored = JSON.parse(
    localStorage.getItem(KEY) || "[]"
  );

  if (Array.isArray(stored)) {
    characters = stored;
  }

} catch {

  characters = [];

}


/* ==========================================
   PERSONNAGE SÉLECTIONNÉ
   ========================================== */

const params = new URLSearchParams(
  window.location.search
);

const characterId = params.get("id");

const character = characters.find(
  c => c.id === characterId
);

if (!character) {

  alert(
    "Personnage introuvable. Retour à l'accueil."
  );

  window.location.replace("index.html");

  return;

}


/* ==========================================
   RÉSERVES ET BLESSURES
   ========================================== */

function maximum(c, attribute) {

  const wounds = c.wounds?.[attribute] || 0;

  return Math.max(
    0,
    baseMax(c[attribute]) - 3 * wounds
  );

}


function prepare(c) {

  if (!c.wounds) {

    c.wounds = {
      physique: 0,
      mental: 0,
      social: 0
    };

  }

  if (!c.pa) {
    c.pa = {};
  }

  if (!Array.isArray(c.skills)) {
    c.skills = [];
  }

  if (!Array.isArray(c.atouts)) {
    c.atouts = [];
  }

  for (const attribute of ATTRS) {

    const woundCount = Number(
      c.wounds[attribute]
    );

    c.wounds[attribute] =
      Number.isFinite(woundCount)
        ? clamp(Math.trunc(woundCount), 0, 20)
        : 0;

    const max = maximum(c, attribute);

    const available = Number(
      c.pa[attribute]
    );

    c.pa[attribute] =
      c.pa[attribute] == null ||
      !Number.isFinite(available)
        ? max
        : clamp(Math.trunc(available), 0, max);

  }

}

prepare(character);


/* ==========================================
   SAUVEGARDE
   ========================================== */

function save() {

  try {

    localStorage.setItem(
      KEY,
      JSON.stringify(characters)
    );

    return true;

  } catch {

    alert(
      "Impossible d'enregistrer cette modification."
    );

    return false;

  }

}


/* ==========================================
   CRÉATION DES LIGNES
   ========================================== */

function addDetailRow(
  parent,
  label,
  value
) {

  const row = document.createElement("div");
  row.className = "detail-row";

  const name = document.createElement("span");
  name.textContent = label;

  const number = document.createElement("strong");
  number.textContent = value;

  row.append(name, number);

  parent.append(row);

}


/* ==========================================
   COMPTEURS INTERACTIFS
   ========================================== */

function counterRow(
  parent,
  label,
  value,
  decrease,
  increase,
  disableDecrease,
  disableIncrease
) {

  const row = document.createElement("div");

  row.className = "detail-row";

  const title = document.createElement("span");
  title.textContent = label;

  const controls = document.createElement("div");
  controls.className = "reserve-counter";

  const minus = document.createElement("button");

  minus.type = "button";
  minus.className = "counter";
  minus.textContent = "−";
  minus.disabled = disableDecrease;

  minus.setAttribute(
    "aria-label",
    "Diminuer " + label
  );

  minus.onclick = decrease;

  const number = document.createElement("strong");
  number.textContent = value;

  const plus = document.createElement("button");

  plus.type = "button";
  plus.className = "counter";
  plus.textContent = "+";
  plus.disabled = disableIncrease;

  plus.setAttribute(
    "aria-label",
    "Augmenter " + label
  );

  plus.onclick = increase;

  controls.append(
    minus,
    number,
    plus
  );

  row.append(
    title,
    controls
  );

  parent.append(row);

}


/* ==========================================
   MODIFIER LES PA
   ========================================== */

function changePA(attribute, delta) {

  const previous = character.pa[attribute];

  character.pa[attribute] = clamp(
    previous + delta,
    0,
    maximum(character, attribute)
  );

  if (!save()) {
    character.pa[attribute] = previous;
  }

  render();

}


/* ==========================================
   MODIFIER LES BLESSURES
   ========================================== */

function changeWounds(attribute, delta) {

  const previousWounds =
    character.wounds[attribute];

  const previousPA =
    character.pa[attribute];

  character.wounds[attribute] = clamp(
    previousWounds + delta,
    0,
    20
  );

  const newMaximum = maximum(
    character,
    attribute
  );

  if (character.pa[attribute] > newMaximum) {
    character.pa[attribute] = newMaximum;
  }

  if (!save()) {

    character.wounds[attribute] =
      previousWounds;

    character.pa[attribute] =
      previousPA;

  }

  render();

}


/* ==========================================
   AFFICHER LES ATTRIBUTS
   ========================================== */

function renderAttributes() {

  const root = $("attributes");

  root.replaceChildren();

  for (const attribute of ATTRS) {

    addDetailRow(
      root,
      ATTR_NAMES[attribute],
      String(character[attribute])
    );

  }

}


/* ==========================================
   AFFICHER LES RÉSERVES
   ========================================== */

function renderReserves() {

  const root = $("reserves");

  root.replaceChildren();

  for (const attribute of ATTRS) {

    const max = maximum(
      character,
      attribute
    );

    counterRow(

      root,

      RESERVES[attribute],

      character.pa[attribute] + " / " + max,

      () => changePA(attribute, -1),

      () => changePA(attribute, 1),

      character.pa[attribute] <= 0,

      character.pa[attribute] >= max

    );

  }

}


/* ==========================================
   AFFICHER LES BLESSURES
   ========================================== */

function renderWounds() {

  const root = $("wounds");

  root.replaceChildren();

  for (const attribute of ATTRS) {

    counterRow(

      root,

      RESERVES[attribute],

      String(character.wounds[attribute]),

      () => changeWounds(attribute, -1),

      () => changeWounds(attribute, 1),

      character.wounds[attribute] <= 0,

      character.wounds[attribute] >= 20

    );

  }

}


/* ==========================================
   CRÉER UN CARTOUCHE
   ========================================== */

function createCard(
  name,
  information,
  description = ""
) {

  const card = document.createElement("div");

  card.className = "game-card";

  const title = document.createElement("div");

  title.className = "game-card-title";
  title.textContent = name;

  const meta = document.createElement("p");

  meta.className = "game-card-meta";
  meta.textContent = information;

  card.append(title, meta);

  if (description) {

    const text = document.createElement("p");

    text.className = "game-card-description";
    text.textContent = description;

    card.append(text);

  }

  return card;

}


/* ==========================================
   ASSOCIATION DES COMPÉTENCES
   ========================================== */

function skillReserve(skill) {

  if (
    skill &&
    ATTRS.includes(skill.reserve)
  ) {
    return skill.reserve;
  }

  return null;

}


/* ==========================================
   AFFICHER LES COMPÉTENCES
   ========================================== */

function renderSkills() {

  const root = $("skills");

  root.replaceChildren();

  if (!character.skills.length) {

    const text = document.createElement("p");

    text.className = "game-empty subtle";
    text.textContent = "Aucune compétence.";

    root.append(text);

    return;

  }

  for (const skill of character.skills) {

    const bonus =
      BONUSES[skill.level - 1] || 0;

    const level =
      LEVELS[skill.level - 1] || "Non défini";

    const reserve = skillReserve(skill);

    const association = reserve
      ? ATTR_NAMES[reserve] +
        " · " +
        RESERVES[reserve]
      : "Caractéristique à définir";

    const card = createCard(
      skill.name,

      level +
      " +" +
      bonus +
      " · " +
      association,

      skill.description || ""
    );

    root.append(card);

  }

}


/* ==========================================
   ACTIVER UN ATOUT
   ========================================== */

function activateAtout(atout) {

  const output = $("atout-result");

  const attribute = atout.reserve;

  const cost = Number(atout.cost);

  if (
    !ATTRS.includes(attribute) ||
    !Number.isInteger(cost) ||
    cost < 1
  ) {

    output.textContent =
      "Cet Atout possède un coût invalide.";

    return;

  }

  if (character.pa[attribute] < cost) {

    output.textContent =
      "PA insuffisants pour activer cet Atout.";

    return;

  }

  const previous = character.pa[attribute];

  character.pa[attribute] -= cost;

  if (!save()) {

    character.pa[attribute] = previous;
    return;

  }

  renderReserves();
  renderAtouts();

  output.textContent =
    atout.name +
    " activé : −" +
    cost +
    " PA de " +
    RESERVES[attribute] +
    ".";

}


/* ==========================================
   AFFICHER LES ATOUTS
   ========================================== */

function renderAtouts() {

  const root = $("atouts");

  root.replaceChildren();

  if (!character.atouts.length) {

    const text = document.createElement("p");

    text.className = "game-empty subtle";
    text.textContent = "Aucun Atout.";

    root.append(text);

    return;

  }

  for (const atout of character.atouts) {

    const reserve = RESERVES[atout.reserve] ||
      "Réserve inconnue";

    const card = createCard(
      atout.name,

      atout.cost +
      " PA · " +
      reserve,

      atout.description || ""
    );

    const button = document.createElement("button");

    button.type = "button";
    button.className = "game-card-button";

    button.textContent =
      "Activer — " +
      atout.cost +
      " PA";

    const cost = Number(atout.cost);

    button.disabled =
      !ATTRS.includes(atout.reserve) ||
      !Number.isInteger(cost) ||
      cost < 1 ||
      character.pa[atout.reserve] < cost;

    button.onclick = () => {
      activateAtout(atout);
    };

    card.append(button);

    root.append(card);

  }

}


/* ==========================================
   AFFICHAGE GÉNÉRAL
   ========================================== */

function render() {

  $("character-name").textContent =
    character.name;

  renderAttributes();

  renderReserves();

  renderWounds();

  renderSkills();

  renderAtouts();

}


/* ==========================================
   NAVIGATION
   ========================================== */

function openPage(filename) {

  const url = new URL(
    filename,
    window.location.href
  );

  url.searchParams.set(
    "id",
    character.id
  );

  window.location.href = url.toString();

}


/* ==========================================
   OUVRIR UNE ACTION
   ========================================== */

$("open-action").onclick = () => {

  openPage("action.html");

};


/* ==========================================
   OUVRIR UNE OPPOSITION
   ========================================== */

$("open-opposition").onclick = () => {

  openPage("opposition.html");

};


/* ==========================================
   QUITTER LE MODE JEU
   ========================================== */

function exitGame() {

  openPage("index.html");

}

$("back").onclick = exitGame;

$("exit").onclick = exitGame;


/* ==========================================
   DÉMARRAGE
   ========================================== */

render();

})();

</script>

</body>
</html>

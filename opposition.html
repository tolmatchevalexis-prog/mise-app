<!doctype html>
<html lang="fr">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#111111">

<meta
  name="description"
  content="M.I.S.E. — Résolution des oppositions"
>

<title>M.I.S.E. — Opposition</title>

<link rel="stylesheet" href="style.css">

<style>

/* ==========================================
   INTERFACE DES OPPOSITIONS
   ========================================== */

.opposition-association {
  margin: 0 0 24px;
  padding: 14px 18px;

  border: 1.5px solid #ffffff;
  border-radius: 12px;

  background: #111111;
  color: #ffffff;
}

.opposition-association-title {
  margin: 0 0 5px;
  font-size: 14px;
  font-weight: 700;
}

.opposition-association-value {
  margin: 0;
  font-size: 16px;
}

.opposition-result {
  white-space: pre-line;
  line-height: 1.7;
}

.opposition-note {
  margin: 12px 0 20px;
  font-size: 14px;
}

</style>

</head>

<body class="game-page">

<main class="app">

<section id="opposition-page">

  <!-- EN-TÊTE -->

  <div class="heading">

    <button
      class="back"
      id="back"
      type="button"
      aria-label="Retour au jeu"
    >
      ←
    </button>

    <h1>M.I.S.E.</h1>

  </div>


  <!-- PERSONNAGE -->

  <div
    class="detail-name"
    id="character-name"
  ></div>

  <h2>Résoudre une opposition</h2>


  <!-- RÉSERVES -->

  <div id="reserves"></div>


  <!-- FORMULAIRE -->

  <form id="opposition-form">

    <h2>Votre personnage</h2>


    <!-- COMPÉTENCE -->

    <label class="field">

      <span class="label">
        Compétence utilisée
      </span>

      <select
        class="input"
        id="skill"
        required
      ></select>

    </label>


    <!-- ASSOCIATION AUTOMATIQUE -->

    <div
      class="opposition-association"
      id="association"
      hidden
    >

      <p class="opposition-association-title">
        Caractéristique et réserve
      </p>

      <p
        class="opposition-association-value"
        id="association-value"
      ></p>

    </div>


    <!-- CHOIX MANUEL SANS COMPÉTENCE -->

    <label
      class="field"
      id="manual-reserve-field"
      hidden
    >

      <span class="label">
        Réserve utilisée
      </span>

      <select
        class="input"
        id="manual-reserve"
      >

        <option
          value=""
          selected
          disabled
        >
          Choisir une réserve
        </option>

        <option value="physique">
          Vigueur
        </option>

        <option value="mental">
          Volonté
        </option>

        <option value="social">
          Influence
        </option>

      </select>

    </label>


    <!-- MISE -->

    <label class="field">

      <span class="label">
        Mise en PA
      </span>

      <input
        class="input"
        id="stake"
        type="number"
        min="1"
        step="1"
        placeholder="Nombre de PA"
        required
      >

    </label>

    <p
      class="subtle opposition-note"
      id="stake-limit"
    ></p>


    <!-- POSTURE -->

    <label class="field">

      <span class="label">
        Posture
      </span>

      <select
        class="input"
        id="posture"
        required
      >

        <option
          value=""
          selected
          disabled
        >
          Choisir une posture
        </option>

        <option value="offensive">
          Offensive
        </option>

        <option value="defensive">
          Défensive
        </option>

        <option value="economique">
          Économique
        </option>

      </select>

    </label>


    <!-- ADVERSAIRE -->

    <h2>Adversaire</h2>


    <!-- MAÎTRISE ADVERSE -->

    <label class="field">

      <span class="label">
        Maîtrise adverse
      </span>

      <select
        class="input"
        id="enemy-bonus"
        required
      >

        <option
          value=""
          selected
          disabled
        >
          Choisir une maîtrise
        </option>

        <option value="0">
          Sans compétence +0
        </option>

        <option value="1">
          Novice +1
        </option>

        <option value="2">
          Confirmé +2
        </option>

        <option value="3">
          Expert +3
        </option>

        <option value="5">
          Maître +5
        </option>

      </select>

    </label>


    <!-- MISE ADVERSE -->

    <label class="field">

      <span class="label">
        Mise adverse en PA
      </span>

      <input
        class="input"
        id="enemy-stake"
        type="number"
        min="1"
        step="1"
        placeholder="Nombre de PA"
        required
      >

    </label>


    <!-- POSTURE ADVERSE -->

    <label class="field">

      <span class="label">
        Posture adverse
      </span>

      <select
        class="input"
        id="enemy-posture"
        required
      >

        <option
          value=""
          selected
          disabled
        >
          Choisir une posture
        </option>

        <option value="offensive">
          Offensive
        </option>

        <option value="defensive">
          Défensive
        </option>

        <option value="economique">
          Économique
        </option>

      </select>

    </label>


    <!-- RÉSOLUTION -->

    <button
      class="box primary"
      id="resolve"
      type="submit"
    >
      Résoudre l'opposition
    </button>

  </form>


  <!-- RÉSULTAT -->

  <div
    id="result-panel"
    hidden
  >

    <h2>Résultat</h2>

    <p
      class="opposition-result"
      id="result"
      role="status"
      aria-live="polite"
    ></p>

  </div>


  <!-- ERREURS -->

  <p
    class="subtle"
    id="error"
    role="alert"
  ></p>


  <!-- RETOUR -->

  <div class="actions group">

    <button
      class="box secondary"
      id="return"
      type="button"
    >
      Retour au jeu
    </button>

  </div>

</section>

</main>


<!-- ======================================
     MOTEUR COMMUN
     ====================================== -->

<script src="app.js"></script>


<!-- ======================================
     INTERFACE DES OPPOSITIONS
     ====================================== -->

<script>

(() => {

"use strict";


/* ========================================
   CONFIGURATION
   ======================================== */

const $ = id =>
  document.getElementById(id);

const params = new URLSearchParams(
  window.location.search
);

const characterId = params.get("id");

const ATTR_NAMES = {
  physique: "Physique",
  mental: "Mental",
  social: "Social"
};

const RESERVE_NAMES = MISE.RESERVES;

let character;


/* ========================================
   CHARGER LE PERSONNAGE
   ======================================== */

try {

  character = MISE.trouverPersonnage(
    characterId
  );

} catch {

  alert(
    "Personnage introuvable."
  );

  window.location.replace(
    "index.html"
  );

  return;

}


/* ========================================
   NAVIGATION
   ======================================== */

function returnToGame() {

  const url = new URL(
    "jeu.html",
    window.location.href
  );

  url.searchParams.set(
    "id",
    characterId
  );

  window.location.href =
    url.toString();

}


/* ========================================
   ACTUALISER LE PERSONNAGE
   ======================================== */

function refreshCharacter() {

  character = MISE.trouverPersonnage(
    characterId
  );

}


/* ========================================
   AFFICHER LES RÉSERVES
   ======================================== */

function renderReserves() {

  const root = $("reserves");

  root.replaceChildren();

  for (const key of MISE.ATTRIBUTS) {

    const row = document.createElement(
      "div"
    );

    row.className = "detail-row";

    const name = document.createElement(
      "span"
    );

    name.textContent =
      RESERVE_NAMES[key];

    const value = document.createElement(
      "strong"
    );

    value.textContent =
      character.pa[key] +
      " / " +
      MISE.maximumPA(character, key) +
      " PA";

    row.append(name, value);

    root.append(row);

  }

}


/* ========================================
   AFFICHER LES COMPÉTENCES
   ======================================== */

function renderSkills() {

  const select = $("skill");

  select.replaceChildren();


  /* Choix initial */

  const placeholder = document.createElement(
    "option"
  );

  placeholder.value = "";

  placeholder.textContent =
    "Choisir une compétence";

  placeholder.disabled = true;
  placeholder.selected = true;

  select.append(placeholder);


  /* Sans compétence */

  const noSkill = document.createElement(
    "option"
  );

  noSkill.value = "none";

  noSkill.textContent =
    "Sans compétence (+0)";

  select.append(noSkill);


  /* Compétences du personnage */

  for (const skill of character.skills) {

    const option = document.createElement(
      "option"
    );

    const niveau =
      MISE.NIVEAUX[skill.level];

    const bonus = niveau
      ? niveau.bonus
      : 0;

    option.value = skill.id;

    if (
      MISE.ATTRIBUTS.includes(
        skill.reserve
      )
    ) {

      option.textContent =
        skill.name +
        " (+" +
        bonus +
        ") — " +
        RESERVE_NAMES[skill.reserve];

    } else {

      /*
        Une compétence ancienne sans
        caractéristique associée reste
        visible, mais indisponible.
      */

      option.textContent =
        skill.name +
        " — Caractéristique à définir";

      option.disabled = true;

    }

    select.append(option);

  }

}


/* ========================================
   TROUVER UNE COMPÉTENCE
   ======================================== */

function findSkill(id) {

  return character.skills.find(
    skill => skill.id === id
  ) || null;

}


/* ========================================
   DÉTERMINER LA RÉSERVE
   ======================================== */

function selectedReserve() {

  const skillId = $("skill").value;

  if (!skillId) {
    return null;
  }


  /*
    Sans compétence :
    choix manuel de la réserve.
  */

  if (skillId === "none") {

    const reserve =
      $("manual-reserve").value;

    return MISE.ATTRIBUTS.includes(reserve)
      ? reserve
      : null;

  }


  /*
    Avec compétence :
    la réserve est automatiquement
    déterminée par la compétence.
  */

  const skill = findSkill(skillId);

  if (
    !skill ||
    !MISE.ATTRIBUTS.includes(
      skill.reserve
    )
  ) {
    return null;
  }

  return skill.reserve;

}


/* ========================================
   AFFICHER L'ASSOCIATION
   ======================================== */

function updateAssociation() {

  const skillId = $("skill").value;

  const association = $("association");

  const manualField =
    $("manual-reserve-field");

  const manualSelect =
    $("manual-reserve");


  association.hidden = true;

  manualField.hidden = true;

  manualSelect.required = false;


  /* Aucun choix */

  if (!skillId) {

    manualSelect.value = "";

    updateLimit();

    return;

  }


  /* Sans compétence */

  if (skillId === "none") {

    manualField.hidden = false;

    manualSelect.required = true;

    manualSelect.value = "";

    updateLimit();

    return;

  }


  /* Compétence associée */

  const skill = findSkill(skillId);

  if (
    !skill ||
    !MISE.ATTRIBUTS.includes(
      skill.reserve
    )
  ) {

    $("association-value").textContent =
      "Caractéristique à définir.";

    association.hidden = false;

    updateLimit();

    return;

  }


  $("association-value").textContent =
    ATTR_NAMES[skill.reserve] +
    " → " +
    RESERVE_NAMES[skill.reserve];

  association.hidden = false;

  updateLimit();

}


/* ========================================
   LIMITE DE MISE
   ======================================== */

function updateLimit() {

  const reserve = selectedReserve();

  const input = $("stake");

  if (!reserve) {

    input.removeAttribute("max");

    $("stake-limit").textContent = "";

    return;

  }


  /*
    La mise ne peut dépasser :
    - la moitié du maximum de la réserve,
      arrondie au supérieur ;
    - les PA actuellement disponibles.
  */

  const maximum =
    MISE.limiteMiseOpposition(
      character,
      reserve
    );

  const disponibles =
    character.pa[reserve];

  const limite = Math.min(
    maximum,
    disponibles
  );


  input.max = limite;


  $("stake-limit").textContent =
    "Mise maximale : " +
    limite +
    " PA · " +
    RESERVE_NAMES[reserve] +
    " disponible : " +
    disponibles +
    " PA.";

}


/* ========================================
   RÉINITIALISER LES CHAMPS
   ======================================== */

function resetFields() {

  $("opposition-form").reset();

  $("skill").selectedIndex = 0;

  $("manual-reserve").selectedIndex = 0;

  $("posture").selectedIndex = 0;

  $("enemy-bonus").selectedIndex = 0;

  $("enemy-posture").selectedIndex = 0;

  $("stake").value = "";

  $("enemy-stake").value = "";


  $("association").hidden = true;

  $("manual-reserve-field").hidden = true;

  $("manual-reserve").required = false;

  $("stake-limit").textContent = "";

  $("stake").removeAttribute("max");

  $("error").textContent = "";

}


/* ========================================
   RÉSOLUTION DE L'OPPOSITION
   ======================================== */

function resolveOpposition(event) {

  event.preventDefault();

  $("error").textContent = "";


  const skillId =
    $("skill").value;

  const reserve =
    selectedReserve();

  const stakeText =
    $("stake").value;

  const enemyStakeText =
    $("enemy-stake").value;

  const posture =
    $("posture").value;

  const enemyPosture =
    $("enemy-posture").value;

  const enemyBonusText =
    $("enemy-bonus").value;


  /* Vérification des choix */

  if (!skillId) {

    $("error").textContent =
      "Choisissez une compétence.";

    return;

  }


  if (!reserve) {

    $("error").textContent =
      "Aucune réserve valide pour cette opposition.";

    return;

  }


  if (
    !posture ||
    !enemyPosture ||
    enemyBonusText === "" ||
    stakeText === "" ||
    enemyStakeText === ""
  ) {

    $("error").textContent =
      "Complétez tous les champs.";

    return;

  }


  const stake = Number(
    stakeText
  );

  const enemyStake = Number(
    enemyStakeText
  );

  const enemyBonus = Number(
    enemyBonusText
  );


  if (
    !Number.isInteger(stake) ||
    stake < 1
  ) {

    $("error").textContent =
      "Votre mise doit être un entier positif.";

    return;

  }


  if (
    !Number.isInteger(enemyStake) ||
    enemyStake < 1
  ) {

    $("error").textContent =
      "La mise adverse doit être un entier positif.";

    return;

  }


  /*
    Vérifier que la compétence
    correspond à sa réserve associée.
  */

  if (skillId !== "none") {

    const skill = findSkill(skillId);

    if (
      !skill ||
      skill.reserve !== reserve
    ) {

      $("error").textContent =
        "Association de compétence invalide.";

      return;

    }

  }


  /* Conserver les choix pour le résultat */

  const selectedPosture =
    $("posture")
      .selectedOptions[0]
      .textContent.trim();

  const selectedEnemyPosture =
    $("enemy-posture")
      .selectedOptions[0]
      .textContent.trim();


  /*
    Résolution par le moteur commun.

    Le moteur est responsable :
    - des scores ;
    - des postures ;
    - du coût des mises ;
    - des dégâts ;
    - des blessures ;
    - de la sauvegarde.
  */

  try {

    const result = MISE.resoudreOpposition({

      personnageId: characterId,

      reserve: reserve,

      competenceId:
        skillId === "none"
          ? null
          : skillId,

      miseJoueur: stake,

      postureJoueur: posture,

      miseAdverse: enemyStake,

      bonusAdverse: enemyBonus,

      postureAdverse: enemyPosture

    });


    /* Actualiser les données */

    refreshCharacter();

    renderReserves();


    /* Préparer le résultat */

    let message = "";


    if (result.egalite) {

      message =
        "ÉGALITÉ\n\n" +

        "Votre score : " +
        result.scoreJoueur +

        "\nScore adverse : " +
        result.scoreAdverse +

        "\n\n" +

        "Décision du Narrateur.\n" +
        "Aucun PA débité automatiquement.";

    } else {

      message =
        (
          result.victoire
            ? "VICTOIRE"
            : "DÉFAITE"
        ) +

        "\n\n" +

        "Votre posture : " +
        selectedPosture +

        "\nPosture adverse : " +
        selectedEnemyPosture +

        "\n\n" +

        "Votre score : " +
        result.scoreJoueur +

        "\nScore adverse : " +
        result.scoreAdverse +

        "\nÉcart : " +
        result.ecart +

        "\n\n" +

        "Mise payée : " +
        result.misePayee +
        " PA" +

        "\nDégâts reçus : " +
        result.degats +

        "\nBlessures reçues : " +
        result.blessures +

        "\n\n" +

        "PA restants : " +
        result.paRestants +
        " / " +
        result.maximumRestant +

        "\nBlessures totales : " +
        result.blessuresTotales;


      if (result.recuperation > 0) {

        message +=
          "\n\nPosture économique : " +
          "+1 PA récupéré.";

      }

    }


    /* Afficher le résultat */

    $("result-panel").hidden = false;

    $("result").textContent = message;


    /*
      Vider les champs après résolution.

      En cas d'erreur, les données saisies
      restent en place.
    */

    resetFields();


  } catch (error) {

    $("error").textContent =
      error.message;

  }

}


/* ========================================
   ÉVÉNEMENTS
   ======================================== */

$("character-name").textContent =
  character.name;


$("opposition-form").addEventListener(
  "submit",
  resolveOpposition
);


/* Compétence */

$("skill").addEventListener(
  "change",
  updateAssociation
);


/* Réserve manuelle */

$("manual-reserve").addEventListener(
  "change",
  updateLimit
);


/* Navigation */

$("back").onclick = returnToGame;

$("return").onclick = returnToGame;


/* ========================================
   DÉMARRAGE
   ======================================== */

renderReserves();

renderSkills();

resetFields();

})();

</script>

</body>
  </html>

<!doctype html>
<html lang="fr">

<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#ffffff">

<meta
  name="description"
  content="M.I.S.E. — Création et gestion de personnages"
>

<title>M.I.S.E. — Personnages</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<main class="app">

<!-- ======================================
     ACCUEIL
     ====================================== -->

<section id="home">

  <header class="brand">M.I.S.E.</header>

  <div id="cards" class="stack"></div>

  <div class="home-bottom">

    <button
      class="box primary"
      id="create"
      type="button"
    >
      Créer un nouveau personnage
    </button>

  </div>

</section>


<!-- ======================================
     CRÉATION ET MODIFICATION
     ====================================== -->

<section id="form" hidden>

  <div class="heading">

    <button
      class="back"
      id="form-back"
      type="button"
      aria-label="Retour"
    >
      ←
    </button>

    <h1 id="form-heading">
      Nouveau personnage
    </h1>

  </div>

  <!-- NOM -->

  <label class="field">

    <span class="label">Nom</span>

    <input
      id="name"
      class="input"
      type="text"
      maxlength="100"
      autocomplete="off"
      placeholder="Nom du personnage"
    >

  </label>

  <!-- ATTRIBUTS -->

  <div
    class="attributes"
    role="group"
    aria-label="Attributs"
  >

    <div class="attribute">

      <span class="attribute-label">
        Physique
      </span>

      <div
        class="dots"
        id="dots-physique"
      ></div>

    </div>

    <div class="attribute">

      <span class="attribute-label">
        Mental
      </span>

      <div
        class="dots"
        id="dots-mental"
      ></div>

    </div>

    <div class="attribute">

      <span class="attribute-label">
        Social
      </span>

      <div
        class="dots"
        id="dots-social"
      ></div>

    </div>

  </div>

  <!-- PORTRAIT -->

  <label class="field">

    <span class="label">
      Portrait (facultatif)
    </span>

    <input
      id="portrait-file"
      class="input"
      type="file"
      accept="image/*"
    >

  </label>

  <img
    id="portrait-preview"
    class="portrait"
    alt="Portrait sélectionné"
    hidden
  >

  <div class="photo-actions">

    <button
      id="portrait-remove"
      class="small"
      type="button"
    >
      Retirer le portrait
    </button>

  </div>

  <!-- COMPÉTENCES -->

  <button
    class="box arrow"
    id="open-skills"
    type="button"
  >
    <span>Compétences</span>
    <span aria-hidden="true">→</span>
  </button>

  <p
    class="subtle count"
    id="skill-count"
  >
    Aucune compétence enregistrée
  </p>

  <!-- ATOUTS -->

  <button
    class="box arrow"
    id="open-atouts"
    type="button"
  >
    <span>Atouts</span>
    <span aria-hidden="true">→</span>
  </button>

  <p
    class="subtle count"
    id="atout-count"
  >
    Aucun Atout enregistré
  </p>

  <!-- HISTORIQUE -->

  <label class="field">

    <span class="label">Historique</span>

    <textarea
      id="history"
      class="input long"
      placeholder="Histoire du personnage (facultatif)"
    ></textarea>

  </label>

  <p
    id="form-error"
    class="error"
    role="alert"
  ></p>

  <!-- VALIDATION -->

  <div class="actions">

    <button
      class="box secondary"
      id="cancel"
      type="button"
    >
      Annuler
    </button>

    <button
      class="box primary"
      id="save"
      type="button"
    >
      Valider le personnage
    </button>

  </div>

</section>


<!-- ======================================
     COMPÉTENCES
     ====================================== -->

<section id="skills" hidden>

  <div class="heading">

    <button
      class="back"
      id="skills-back"
      type="button"
      aria-label="Retour"
    >
      ←
    </button>

    <h1>Compétences</h1>

  </div>

  <div id="skill-list"></div>

  <div class="group">

    <label class="field">

      <span class="label">
        Nom de la compétence
      </span>

      <input
        id="skill-name"
        class="input"
        type="text"
        maxlength="100"
      >

    </label>

    <div class="label">
      Niveau de maîtrise
    </div>

    <div class="attribute">

      <span id="level-label">
        Novice +1
      </span>

      <div
        class="dots"
        id="level-dots"
      ></div>

    </div>

    <label class="field group">

      <span class="label">
        Description (facultative)
      </span>

      <textarea
        id="skill-description"
        class="input long"
        style="min-height:110px"
      ></textarea>

    </label>

    <p
      id="skill-error"
      class="error"
      role="alert"
    ></p>

    <button
      class="box primary"
      id="add-skill"
      type="button"
    >
      Ajouter la compétence
    </button>

  </div>

  <div class="actions">

    <button
      class="box secondary"
      id="skills-done"
      type="button"
    >
      Retour au personnage
    </button>

  </div>

</section>


<!-- ======================================
     ATOUTS
     ====================================== -->

<section id="atouts" hidden>

  <div class="heading">

    <button
      class="back"
      id="atouts-back"
      type="button"
      aria-label="Retour"
    >
      ←
    </button>

    <h1>Atouts</h1>

  </div>

  <div id="atout-list"></div>

  <div class="group">

    <label class="field">

      <span class="label">
        Nom de l'Atout
      </span>

      <input
        id="atout-name"
        class="input"
        type="text"
        maxlength="100"
      >

    </label>

    <label class="field">

      <span class="label">
        Réserve utilisée
      </span>

      <select
        id="atout-reserve"
        class="input"
      >

        <option value="physique">
          Vigueur
        </option>

        <option value="mental">
          Volonté
        </option>

        <option value="social">
          Influence
        </option>

      </select>

    </label>

    <label class="field">

      <span class="label">
        Coût fixe en PA
      </span>

      <input
        id="atout-cost"
        class="input"
        type="number"
        min="1"
        max="999"
        step="1"
        value="1"
      >

    </label>

    <label class="field">

      <span class="label">
        Description (facultative)
      </span>

      <textarea
        id="atout-description"
        class="input long"
        style="min-height:110px"
      ></textarea>

    </label>

    <p
      id="atout-error"
      class="error"
      role="alert"
    ></p>

    <button
      class="box primary"
      id="add-atout"
      type="button"
    >
      Ajouter l'Atout
    </button>

  </div>

  <div class="actions">

    <button
      class="box secondary"
      id="atouts-done"
      type="button"
    >
      Retour au personnage
    </button>

  </div>

</section>


<!-- ======================================
     FICHE DU PERSONNAGE
     ====================================== -->

<section id="detail" hidden>

  <div class="heading">

    <button
      class="back"
      id="detail-back"
      type="button"
      aria-label="Retour à l'accueil"
    >
      ←
    </button>

    <h1>Personnage</h1>

  </div>

  <!-- PORTRAIT -->

  <img
    id="detail-portrait"
    class="portrait"
    alt="Portrait du personnage"
    hidden
  >

  <!-- NOM -->

  <div
    class="detail-name"
    id="detail-name"
  ></div>

  <!-- ATTRIBUTS -->

  <h2>Attributs</h2>

  <div id="detail-attrs"></div>

  <!-- RÉSERVES -->

  <h2>Réserves de PA</h2>

  <div id="detail-reserves"></div>

  <!-- COMPÉTENCES -->

  <h2>Compétences</h2>

  <ul
    id="detail-skills"
    class="detail-list"
  ></ul>

  <!-- ATOUTS -->

  <h2>Atouts</h2>

  <ul
    id="detail-atouts"
    class="detail-list"
  ></ul>

  <!-- HISTORIQUE -->

  <h2>Historique</h2>

  <p
    id="detail-history"
    class="detail-history"
  ></p>

  <!-- ACTIONS -->

  <div class="actions">

    <button
      class="box primary play-button"
      id="play"
      type="button"
    >
      Jouer ce personnage
    </button>

    <button
      class="box secondary"
      id="edit"
      type="button"
    >
      Modifier le personnage
    </button>

  </div>

  <button
    class="danger"
    id="delete-character"
    type="button"
  >
    Supprimer ce personnage
  </button>

</section>

</main>


<!-- ======================================
     APPLICATION
     ====================================== -->

<script>
(() => {

"use strict";

/* ========================================
   CONFIGURATION
   ======================================== */

const $ = id =>
  document.getElementById(id);

const KEY = "mise-app-characters-v1";

const ATTRS = [
  "physique",
  "mental",
  "social"
];

const RESERVES = {
  physique: "Vigueur",
  mental: "Volonté",
  social: "Influence"
};

const NIVEAUX = [
  "Novice",
  "Confirmé",
  "Expert",
  "Maître"
];

const BONUS = [1, 2, 3, 5];

const SCREENS = [
  "home",
  "form",
  "skills",
  "atouts",
  "detail"
];

const clone = value =>
  JSON.parse(JSON.stringify(value));

const uid = () =>
  crypto.randomUUID();

const clamp = (value, min, max) =>
  Math.max(min, Math.min(max, value));

const baseMax = value =>
  value * 3 + 5;


/* ========================================
   ÉTAT DE L'APPLICATION
   ======================================== */

let personnages = [];

let brouillon = null;

let personnageSelectionne = null;

let niveauChoisi = 1;

let portraitEnAttente = null;

let supprimerPortrait = false;

let urlApercu = null;

let urlPortraitFiche = null;

let versionApercu = 0;

let versionFiche = 0;


/* ========================================
   CHARGEMENT DES PERSONNAGES
   ======================================== */

try {

  const donnees = JSON.parse(
    localStorage.getItem(KEY) || "[]"
  );

  if (Array.isArray(donnees)) {
    personnages = donnees;
  }

} catch {

  personnages = [];

}


/* ========================================
   SAUVEGARDE
   ======================================== */

function sauvegarder() {

  try {

    localStorage.setItem(
      KEY,
      JSON.stringify(personnages)
    );

    return true;

  } catch {

    return false;

  }

}


/* ========================================
   RÉSERVES ET BLESSURES
   ======================================== */

function maximumPA(personnage, attribut) {

  const blessures =
    personnage.wounds?.[attribut] || 0;

  return Math.max(
    0,
    baseMax(personnage[attribut]) -
    3 * blessures
  );

}


function preparerPersonnage(personnage) {

  if (!personnage.wounds) {

    personnage.wounds = {
      physique: 0,
      mental: 0,
      social: 0
    };

  }

  if (!personnage.pa) {
    personnage.pa = {};
  }

  if (!Array.isArray(personnage.skills)) {
    personnage.skills = [];
  }

  if (!Array.isArray(personnage.atouts)) {
    personnage.atouts = [];
  }

  if (typeof personnage.history !== "string") {
    personnage.history = "";
  }

  for (const attribut of ATTRS) {

    const blessures = Number(
      personnage.wounds[attribut]
    );

    personnage.wounds[attribut] =
      Number.isFinite(blessures)
        ? clamp(Math.trunc(blessures), 0, 20)
        : 0;

    const maximum = maximumPA(
      personnage,
      attribut
    );

    const disponibles = Number(
      personnage.pa[attribut]
    );

    personnage.pa[attribut] =
      personnage.pa[attribut] == null ||
      !Number.isFinite(disponibles)
        ? maximum
        : clamp(
            Math.trunc(disponibles),
            0,
            maximum
          );

  }

  return personnage;

}


/* ========================================
   PORTRAITS — INDEXEDDB
   ======================================== */

let promesseBase = null;


function ouvrirBaseImages() {

  if (!("indexedDB" in window)) {
    return Promise.resolve(null);
  }

  if (!promesseBase) {

    promesseBase = new Promise(resolve => {

      const requete = indexedDB.open(
        "mise-portraits-v1",
        1
      );

      requete.onupgradeneeded = () => {

        const base = requete.result;

        if (
          !base.objectStoreNames.contains("images")
        ) {

          base.createObjectStore("images");

        }

      };

      requete.onsuccess = () => {
        resolve(requete.result);
      };

      requete.onerror = () => {
        resolve(null);
      };

      requete.onblocked = () => {
        resolve(null);
      };

    });

  }

  return promesseBase;

}


async function lirePortrait(id) {

  const base = await ouvrirBaseImages();

  if (!base || !id) return null;

  return new Promise(resolve => {

    try {

      const transaction = base.transaction(
        "images",
        "readonly"
      );

      const requete = transaction
        .objectStore("images")
        .get(id);

      requete.onsuccess = () => {
        resolve(requete.result || null);
      };

      requete.onerror = () => {
        resolve(null);
      };

    } catch {

      resolve(null);

    }

  });

}


async function enregistrerPortrait(id, image) {

  const base = await ouvrirBaseImages();

  if (!base) {
    throw new Error(
      "Stockage des portraits indisponible"
    );
  }

  return new Promise((resolve, reject) => {

    try {

      const transaction = base.transaction(
        "images",
        "readwrite"
      );

      transaction
        .objectStore("images")
        .put(image, id);

      transaction.oncomplete = () => {
        resolve();
      };

      transaction.onerror = () => {
        reject(
          new Error(
            "Impossible d'enregistrer le portrait"
          )
        );
      };

    } catch (erreur) {

      reject(erreur);

    }

  });

}


async function effacerPortrait(id) {

  const base = await ouvrirBaseImages();

  if (!base) {
    throw new Error(
      "Stockage des portraits indisponible"
    );
  }

  return new Promise((resolve, reject) => {

    try {

      const transaction = base.transaction(
        "images",
        "readwrite"
      );

      transaction
        .objectStore("images")
        .delete(id);

      transaction.oncomplete = () => {
        resolve();
      };

      transaction.onerror = () => {
        reject(
          new Error(
            "Impossible d'effacer le portrait"
          )
        );
      };

    } catch (erreur) {

      reject(erreur);

    }

  });

}


/* ========================================
   AFFICHAGE DES IMAGES
   ======================================== */

function afficherImage(element, image, type) {

  const ancienneURL =
    type === "apercu"
      ? urlApercu
      : urlPortraitFiche;

  if (ancienneURL) {
    URL.revokeObjectURL(ancienneURL);
  }

  if (type === "apercu") {
    urlApercu = null;
  } else {
    urlPortraitFiche = null;
  }

  element.hidden = true;
  element.removeAttribute("src");

  if (!image) return;

  const nouvelleURL = URL.createObjectURL(
    image
  );

  element.src = nouvelleURL;
  element.hidden = false;

  if (type === "apercu") {
    urlApercu = nouvelleURL;
  } else {
    urlPortraitFiche = nouvelleURL;
  }

}


async function chargerApercu(id) {

  const version = ++versionApercu;

  const element = $("portrait-preview");

  afficherImage(element, null, "apercu");

  if (!id) return;

  const image = await lirePortrait(id);

  if (
    version !== versionApercu ||
    !brouillon ||
    brouillon.id !== id ||
    portraitEnAttente ||
    supprimerPortrait
  ) {
    return;
  }

  afficherImage(element, image, "apercu");

}


async function chargerPortraitFiche(id) {

  const version = ++versionFiche;

  const element = $("detail-portrait");

  afficherImage(element, null, "fiche");

  if (!id) return;

  const image = await lirePortrait(id);

  if (
    version !== versionFiche ||
    personnageSelectionne !== id
  ) {
    return;
  }

  afficherImage(element, image, "fiche");

}


/* ========================================
   NAVIGATION
   ======================================== */

function afficherPage(page) {

  for (const nom of SCREENS) {
    $(nom).hidden = nom !== page;
  }

  window.scrollTo(0, 0);

  if (page === "home") {
    afficherAccueil();
  }

  if (page === "detail") {
    afficherFiche();
  }

  if (page === "skills") {
    afficherCompetences();
  }

  if (page === "atouts") {
    afficherAtouts();
  }

}


/* ========================================
   CERCLES DES ATTRIBUTS
   ======================================== */

function afficherCercles(
  elementId,
  valeur,
  modifier,
  nom
) {

  const element = $(elementId);

  element.replaceChildren();

  for (let n = 1; n <= 4; n++) {

    const bouton = document.createElement(
      "button"
    );

    bouton.type = "button";

    bouton.className =
      "dot" +
      (n <= valeur ? " active" : "");

    bouton.setAttribute(
      "aria-label",
      nom + " : " + n + " sur 4"
    );

    bouton.setAttribute(
      "aria-pressed",
      String(n <= valeur)
    );

    bouton.onclick = () => modifier(n);

    element.append(bouton);

  }

}


/* ========================================
   ACCUEIL
   ======================================== */

function afficherAccueil() {

  const conteneur = $("cards");

  conteneur.replaceChildren();

  for (const personnage of personnages) {

    const bouton = document.createElement(
      "button"
    );

    bouton.type = "button";

    bouton.className = "box card";

    bouton.textContent = personnage.name;

    bouton.onclick = () => {

      personnageSelectionne = personnage.id;

      afficherPage("detail");

    };

    conteneur.append(bouton);

  }

}


/* ========================================
   NOUVEAU PERSONNAGE
   ======================================== */

function nouveauPersonnage() {

  return {

    id: null,

    name: "",

    physique: 1,
    mental: 1,
    social: 1,

    history: "",

    skills: [],
    atouts: [],

    wounds: {
      physique: 0,
      mental: 0,
      social: 0
    },

    pa: {
      physique: 8,
      mental: 8,
      social: 8
    }

  };

}


/* ========================================
   ÉDITION
   ======================================== */

function ouvrirEdition(personnage) {

  brouillon = preparerPersonnage(
    clone(personnage)
  );

  portraitEnAttente = null;

  supprimerPortrait = false;

  $("portrait-file").value = "";

  $("name").value = brouillon.name;

  $("history").value = brouillon.history;

  $("form-heading").textContent =
    brouillon.id
      ? "Modifier le personnage"
      : "Nouveau personnage";

  $("form-error").textContent = "";

  afficherAttributs();

  actualiserCompteurs();

  afficherPage("form");

  chargerApercu(brouillon.id);

}


function afficherAttributs() {

  for (const attribut of ATTRS) {

    afficherCercles(
      "dots-" + attribut,

      brouillon[attribut],

      valeur => {

        brouillon[attribut] = valeur;

        afficherAttributs();

      },

      attribut
    );

  }

}


function synchroniserChamps() {

  brouillon.name = $("name").value;

  brouillon.history = $("history").value;

}


function actualiserCompteurs() {

  const competences = brouillon.skills.length;

  const atouts = brouillon.atouts.length;

  $("skill-count").textContent =
    competences
      ? competences +
        " compétence" +
        (competences > 1 ? "s" : "") +
        " enregistrée" +
        (competences > 1 ? "s" : "")
      : "Aucune compétence enregistrée";

  $("atout-count").textContent =
    atouts
      ? atouts +
        " Atout" +
        (atouts > 1 ? "s" : "") +
        " enregistré" +
        (atouts > 1 ? "s" : "")
      : "Aucun Atout enregistré";

}


/* ========================================
   LISTES MODIFIABLES
   ======================================== */

function afficherListeEditable(
  conteneur,
  elements,
  description,
  retirer
) {

  conteneur.replaceChildren();

  if (!elements.length) {

    const texte = document.createElement("p");

    texte.className = "subtle";

    texte.textContent =
      "Aucun élément enregistré.";

    conteneur.append(texte);

  }

  for (const element of elements) {

    const ligne = document.createElement("div");

    ligne.className = "skillrow";

    const informations = document.createElement(
      "div"
    );

    const titre = document.createElement("div");

    titre.textContent = element.name;

    const detail = document.createElement("p");

    detail.textContent = description(element);

    informations.append(titre, detail);

    const bouton = document.createElement(
      "button"
    );

    bouton.type = "button";

    bouton.className = "small";

    bouton.textContent = "Retirer";

    bouton.setAttribute(
      "aria-label",
      "Retirer " + element.name
    );

    bouton.onclick = () => retirer(element);

    ligne.append(informations, bouton);

    conteneur.append(ligne);

  }

}


/* ========================================
   COMPÉTENCES
   ======================================== */

function afficherCompetences() {

  afficherListeEditable(

    $("skill-list"),

    brouillon.skills,

    competence => {

      return (
        NIVEAUX[competence.level - 1] +
        " +" +
        BONUS[competence.level - 1] +
        (
          competence.description
            ? " — " + competence.description
            : ""
        )
      );

    },

    competence => {

      brouillon.skills =
        brouillon.skills.filter(
          item => item.id !== competence.id
        );

      afficherCompetences();

    }

  );

  afficherNiveau();

}


function afficherNiveau() {

  afficherCercles(

    "level-dots",

    niveauChoisi,

    valeur => {

      niveauChoisi = valeur;

      afficherNiveau();

    },

    "Niveau de maîtrise"

  );

  $("level-label").textContent =
    NIVEAUX[niveauChoisi - 1] +
    " +" +
    BONUS[niveauChoisi - 1];

}


/* ========================================
   ATOUTS
   ======================================== */

function afficherAtouts() {

  afficherListeEditable(

    $("atout-list"),

    brouillon.atouts,

    atout => {

      return (
        atout.cost +
        " PA de " +
        RESERVES[atout.reserve] +
        (
          atout.description
            ? " — " + atout.description
            : ""
        )
      );

    },

    atout => {

      brouillon.atouts =
        brouillon.atouts.filter(
          item => item.id !== atout.id
        );

      afficherAtouts();

    }

  );

}


/* ========================================
   LIGNES DE LA FICHE
   ======================================== */

function ajouterLigne(
  conteneur,
  libelle,
  valeur
) {

  const ligne = document.createElement("div");

  ligne.className = "detail-row";

  const titre = document.createElement("span");

  titre.textContent = libelle;

  const donnees = document.createElement(
    "strong"
  );

  donnees.textContent = valeur;

  ligne.append(titre, donnees);

  conteneur.append(ligne);

}


function afficherListe(
  conteneurId,
  elements,
  description
) {

  const conteneur = $(conteneurId);

  conteneur.replaceChildren();

  if (!elements.length) {

    const ligne = document.createElement("li");

    ligne.className = "subtle";

    ligne.textContent = "Aucun élément.";

    conteneur.append(ligne);

  }

  for (const element of elements) {

    const ligne = document.createElement("li");

    ligne.textContent = description(element);

    conteneur.append(ligne);

  }

}


/* ========================================
   PERSONNAGE SÉLECTIONNÉ
   ======================================== */

function personnageActuel() {

  return personnages.find(
    p => p.id === personnageSelectionne
  );

}


/* ========================================
   AFFICHAGE DE LA FICHE
   ======================================== */

function afficherFiche() {

  const personnage = personnageActuel();

  if (!personnage) {

    afficherPage("home");

    return;

  }

  preparerPersonnage(personnage);

  $("detail-name").textContent =
    personnage.name;

  chargerPortraitFiche(personnage.id);

  const zoneAttributs = $("detail-attrs");

  zoneAttributs.replaceChildren();

  const zoneReserves = $("detail-reserves");

  zoneReserves.replaceChildren();

  for (const attribut of ATTRS) {

    const nom =
      attribut.charAt(0).toUpperCase() +
      attribut.slice(1);

    /*
      CORRECTION 2

      Affichage de la valeur seule :
      Physique 3, et non Physique 3 / 4.
    */

    ajouterLigne(
      zoneAttributs,
      nom,
      String(personnage[attribut])
    );

    ajouterLigne(
      zoneReserves,
      RESERVES[attribut],
      personnage.pa[attribut] +
      " / " +
      maximumPA(personnage, attribut) +
      " PA"
    );

  }

  /* COMPÉTENCES */

  afficherListe(

    "detail-skills",

    personnage.skills,

    competence => {

      return (
        competence.name +
        " — " +
        NIVEAUX[competence.level - 1] +
        " (+" +
        BONUS[competence.level - 1] +
        ")" +
        (
          competence.description
            ? " · " + competence.description
            : ""
        )
      );

    }

  );

  /* ATOUTS */

  afficherListe(

    "detail-atouts",

    personnage.atouts,

    atout => {

      return (
        atout.name +
        " — " +
        atout.cost +
        " PA de " +
        RESERVES[atout.reserve] +
        (
          atout.description
            ? " · " + atout.description
            : ""
        )
      );

    }

  );

  /* HISTORIQUE */

  $("detail-history").textContent =
    personnage.history || "Aucun historique.";

}


/* ========================================
   ÉVÉNEMENTS
   ======================================== */

/* CRÉATION */

$("create").onclick = () => {

  ouvrirEdition(
    nouveauPersonnage()
  );

};


/* ANNULATION */

$("form-back").onclick =
$("cancel").onclick = () => {

  afficherPage(
    brouillon.id ? "detail" : "home"
  );

};


/* IMPORTER UN PORTRAIT */

$("portrait-file").onchange = () => {

  const fichier =
    $("portrait-file").files[0];

  if (!fichier) return;

  if (!fichier.type.startsWith("image/")) {

    $("form-error").textContent =
      "Choisissez un fichier image.";

    return;

  }

  versionApercu++;

  portraitEnAttente = fichier;

  supprimerPortrait = false;

  afficherImage(
    $("portrait-preview"),
    fichier,
    "apercu"
  );

  $("form-error").textContent = "";

};


/* RETIRER UN PORTRAIT */

$("portrait-remove").onclick = () => {

  versionApercu++;

  portraitEnAttente = null;

  supprimerPortrait = true;

  $("portrait-file").value = "";

  afficherImage(
    $("portrait-preview"),
    null,
    "apercu"
  );

};


/* OUVRIR LES COMPÉTENCES */

$("open-skills").onclick = () => {

  synchroniserChamps();

  niveauChoisi = 1;

  $("skill-name").value = "";

  $("skill-description").value = "";

  $("skill-error").textContent = "";

  afficherPage("skills");

};


/* RETOUR DES COMPÉTENCES */

$("skills-back").onclick =
$("skills-done").onclick = () => {

  actualiserCompteurs();

  afficherPage("form");

};


/* AJOUTER UNE COMPÉTENCE */

$("add-skill").onclick = () => {

  const nom =
    $("skill-name").value.trim();

  if (!nom) {

    $("skill-error").textContent =
      "Indiquez un nom de compétence.";

    return;

  }

  const existe = brouillon.skills.some(
    competence =>
      competence.name.toLocaleLowerCase("fr") ===
      nom.toLocaleLowerCase("fr")
  );

  if (existe) {

    $("skill-error").textContent =
      "Cette compétence existe déjà.";

    return;

  }

  brouillon.skills.push({

    id: uid(),

    name: nom,

    level: niveauChoisi,

    description:
      $("skill-description").value.trim()

  });

  $("skill-name").value = "";

  $("skill-description").value = "";

  $("skill-error").textContent = "";

  niveauChoisi = 1;

  afficherCompetences();

};


/* OUVRIR LES ATOUTS */

$("open-atouts").onclick = () => {

  synchroniserChamps();

  $("atout-name").value = "";

  $("atout-description").value = "";

  $("atout-reserve").value = "physique";

  $("atout-cost").value = "1";

  $("atout-error").textContent = "";

  afficherPage("atouts");

};


/* RETOUR DES ATOUTS */

$("atouts-back").onclick =
$("atouts-done").onclick = () => {

  actualiserCompteurs();

  afficherPage("form");

};


/* AJOUTER UN ATOUT */

$("add-atout").onclick = () => {

  const nom =
    $("atout-name").value.trim();

  const cout =
    Number($("atout-cost").value);

  const reserve =
    $("atout-reserve").value;

  if (!nom) {

    $("atout-error").textContent =
      "Indiquez un nom d'Atout.";

    return;

  }

  if (
    !Number.isInteger(cout) ||
    cout < 1 ||
    cout > 999
  ) {

    $("atout-error").textContent =
      "Indiquez un coût entier entre 1 et 999 PA.";

    return;

  }

  if (!ATTRS.includes(reserve)) {

    $("atout-error").textContent =
      "Sélectionnez une réserve valide.";

    return;

  }

  const existe = brouillon.atouts.some(
    atout =>
      atout.name.toLocaleLowerCase("fr") ===
      nom.toLocaleLowerCase("fr")
  );

  if (existe) {

    $("atout-error").textContent =
      "Cet Atout existe déjà.";

    return;

  }

  brouillon.atouts.push({

    id: uid(),

    name: nom,

    cost: cout,

    reserve: reserve,

    description:
      $("atout-description").value.trim()

  });

  $("atout-name").value = "";

  $("atout-description").value = "";

  $("atout-cost").value = "1";

  $("atout-error").textContent = "";

  afficherAtouts();

};


/* ========================================
   ENREGISTRER LE PERSONNAGE
   ======================================== */

$("save").onclick = async () => {

  synchroniserChamps();

  brouillon.name =
    brouillon.name.trim();

  if (!brouillon.name) {

    $("form-error").textContent =
      "Indiquez le nom du personnage.";

    return;

  }

  const nouveau = !brouillon.id;

  /*
    CORRECTION 1

    Un nouveau personnage commence
    avec toutes ses réserves pleines.

    Exemple :
    Physique 3 = 14 PA de Vigueur.
  */

  if (nouveau) {

    brouillon.id = uid();

    for (const attribut of ATTRS) {

      brouillon.pa[attribut] =
        maximumPA(brouillon, attribut);

    }

  }

  preparerPersonnage(brouillon);

  const anciens = personnages;

  /*
    Pour un personnage existant,
    on conserve les PA disponibles.

    En cas de modification des attributs,
    ils restent limités au nouveau maximum.
  */

  if (!nouveau) {

    for (const attribut of ATTRS) {

      brouillon.pa[attribut] = Math.min(
        brouillon.pa[attribut],
        maximumPA(brouillon, attribut)
      );

    }

  }

  const nouveaux = [

    ...personnages.filter(
      p => p.id !== brouillon.id
    ),

    clone(brouillon)

  ];

  personnages = nouveaux;

  if (!sauvegarder()) {

    personnages = anciens;

    if (nouveau) {
      brouillon.id = null;
    }

    $("form-error").textContent =
      "Impossible de sauvegarder sur cet appareil.";

    return;

  }

  const bouton = $("save");

  bouton.disabled = true;

  let erreurPortrait = false;

  try {

    if (supprimerPortrait) {

      await effacerPortrait(
        brouillon.id
      );

    } else if (portraitEnAttente) {

      await enregistrerPortrait(
        brouillon.id,
        portraitEnAttente
      );

    }

  } catch {

    erreurPortrait = true;

  } finally {

    bouton.disabled = false;

  }

  personnageSelectionne = brouillon.id;

  afficherPage("detail");

  if (erreurPortrait) {

    alert(
      "Le personnage a été enregistré, " +
      "mais le portrait n'a pas pu être sauvegardé."
    );

  }

};


/* ========================================
   RETOUR À L'ACCUEIL
   ======================================== */

$("detail-back").onclick = () => {

  afficherPage("home");

};


/* ========================================
   MODIFIER LE PERSONNAGE
   ======================================== */

$("edit").onclick = () => {

  const personnage =
    personnageActuel();

  if (personnage) {

    ouvrirEdition(personnage);

  }

};


/* ========================================
   SUPPRIMER LE PERSONNAGE
   ======================================== */

$("delete-character").onclick = async () => {

  const personnage =
    personnageActuel();

  if (!personnage) return;

  const confirmation = confirm(
    "Supprimer définitivement « " +
    personnage.name +
    " » ?\n\nCette action est irréversible."
  );

  if (!confirmation) return;

  const anciens = personnages;

  personnages = personnages.filter(
    p => p.id !== personnage.id
  );

  if (!sauvegarder()) {

    personnages = anciens;

    alert(
      "Impossible de supprimer le personnage."
    );

    return;

  }

  try {

    await effacerPortrait(
      personnage.id
    );

  } catch (erreur) {

    console.warn(
      "Le portrait n'a pas pu être effacé.",
      erreur
    );

  }

  personnageSelectionne = null;

  afficherPage("home");

};


/* ========================================
   JOUER CE PERSONNAGE
   ======================================== */

$("play").onclick = () => {

  const personnage =
    personnageActuel();

  if (!personnage) return;

  const adresse = new URL(
    "jeu.html",
    window.location.href
  );

  adresse.searchParams.set(
    "id",
    personnage.id
  );

  window.location.href =
    adresse.toString();

};


/* ========================================
   DÉMARRAGE
   ======================================== */

const parametres = new URLSearchParams(
  window.location.search
);

const idRetour = parametres.get("id");

if (
  idRetour &&
  personnages.some(p => p.id === idRetour)
) {

  personnageSelectionne = idRetour;

  afficherPage("detail");

} else {

  afficherPage("home");

}

})();
</script>

<!doctype html>
<html lang="fr">

<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#ffffff">

<meta
  name="description"
  content="M.I.S.E. — Création et gestion de personnages"
>

<title>M.I.S.E. — Personnages</title>

<link rel="stylesheet" href="style.css">

<style>

/* ==========================================
   CARTOUCHES INDÉPENDANTS
   Spécifiques à la fiche de personnage
   ========================================== */

.mise-cards {
  display: grid;
  gap: 12px;
  margin: 8px 0 20px;
  padding: 0;
  list-style: none;
}

.mise-card {
  min-width: 0;
  padding: 16px 18px;
  border: 1.5px solid #111111;
  border-radius: 12px;
  background: #ffffff;
  color: #111111;
  overflow-wrap: anywhere;
}

.mise-card-title {
  margin: 0 0 6px;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 16px;
  font-weight: 700;
}

.mise-card-meta {
  margin: 0;
  font-size: 14px;
  line-height: 1.5;
}

.mise-card-description {
  margin: 10px 0 0;
  font-size: 14px;
  line-height: 1.5;
  white-space: pre-wrap;
}

.mise-card-actions {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  margin-top: 14px;
}

.mise-card-actions .small {
  flex-shrink: 0;
}

.mise-card-select {
  width: 100%;
  min-width: 0;
  padding: 10px 12px;
  border: 1px solid #111111;
  border-radius: 8px;
  background: #ffffff;
  color: #111111;
  font: inherit;
  font-size: 14px;
}

.mise-card-note {
  margin: 10px 0 0;
  font-size: 13px;
}

.mise-empty {
  margin: 8px 0 18px;
  font-size: 14px;
}

</style>

</head>

<body>

<main class="app">


<!-- ======================================
     ACCUEIL
     ====================================== -->

<section id="home">

  <header class="brand">M.I.S.E.</header>

  <div id="cards" class="stack"></div>

  <div class="home-bottom">

    <button
      class="box primary"
      id="create"
      type="button"
    >
      Créer un nouveau personnage
    </button>

  </div>

</section>


<!-- ======================================
     CRÉATION ET MODIFICATION
     ====================================== -->

<section id="form" hidden>

  <div class="heading">

    <button
      class="back"
      id="form-back"
      type="button"
      aria-label="Retour"
    >
      ←
    </button>

    <h1 id="form-heading">
      Nouveau personnage
    </h1>

  </div>


  <!-- NOM -->

  <label class="field">

    <span class="label">
      Nom
    </span>

    <input
      id="name"
      class="input"
      type="text"
      maxlength="100"
      autocomplete="off"
      placeholder="Nom du personnage"
    >

  </label>


  <!-- ATTRIBUTS -->

  <div
    class="attributes"
    role="group"
    aria-label="Attributs"
  >

    <div class="attribute">

      <span class="attribute-label">
        Physique
      </span>

      <div
        class="dots"
        id="dots-physique"
      ></div>

    </div>

    <div class="attribute">

      <span class="attribute-label">
        Mental
      </span>

      <div
        class="dots"
        id="dots-mental"
      ></div>

    </div>

    <div class="attribute">

      <span class="attribute-label">
        Social
      </span>

      <div
        class="dots"
        id="dots-social"
      ></div>

    </div>

  </div>


  <!-- PORTRAIT -->

  <label class="field">

    <span class="label">
      Portrait (facultatif)
    </span>

    <input
      id="portrait-file"
      class="input"
      type="file"
      accept="image/*"
    >

  </label>

  <img
    id="portrait-preview"
    class="portrait"
    alt="Portrait sélectionné"
    hidden
  >

  <div class="photo-actions">

    <button
      id="portrait-remove"
      class="small"
      type="button"
    >
      Retirer le portrait
    </button>

  </div>


  <!-- COMPÉTENCES -->

  <button
    class="box arrow"
    id="open-skills"
    type="button"
  >
    <span>Compétences</span>
    <span aria-hidden="true">→</span>
  </button>

  <p
    class="subtle count"
    id="skill-count"
  >
    Aucune compétence enregistrée
  </p>


  <!-- ATOUTS -->

  <button
    class="box arrow"
    id="open-atouts"
    type="button"
  >
    <span>Atouts</span>
    <span aria-hidden="true">→</span>
  </button>

  <p
    class="subtle count"
    id="atout-count"
  >
    Aucun Atout enregistré
  </p>


  <!-- HISTORIQUE -->

  <label class="field">

    <span class="label">
      Historique
    </span>

    <textarea
      id="history"
      class="input long"
      placeholder="Histoire du personnage (facultatif)"
    ></textarea>

  </label>


  <p
    id="form-error"
    class="error"
    role="alert"
  ></p>


  <!-- VALIDATION -->

  <div class="actions">

    <button
      class="box secondary"
      id="cancel"
      type="button"
    >
      Annuler
    </button>

    <button
      class="box primary"
      id="save"
      type="button"
    >
      Valider le personnage
    </button>

  </div>

</section>


<!-- ======================================
     COMPÉTENCES
     ====================================== -->

<section id="skills" hidden>

  <div class="heading">

    <button
      class="back"
      id="skills-back"
      type="button"
      aria-label="Retour"
    >
      ←
    </button>

    <h1>Compétences</h1>

  </div>


  <!-- COMPÉTENCES ENREGISTRÉES -->

  <div
    id="skill-list"
    class="mise-cards"
  ></div>


  <!-- NOUVELLE COMPÉTENCE -->

  <div class="group">

    <h2>Nouvelle compétence</h2>

    <label class="field">

      <span class="label">
        Nom de la compétence
      </span>

      <input
        id="skill-name"
        class="input"
        type="text"
        maxlength="100"
        placeholder="Ex. Combat"
      >

    </label>


    <!-- CARACTÉRISTIQUE ASSOCIÉE -->

    <label class="field">

      <span class="label">
        Caractéristique associée
      </span>

      <select
        id="skill-reserve"
        class="input"
        required
      >

        <option
          value=""
          selected
          disabled
        >
          Choisir une caractéristique
        </option>

        <option value="physique">
          Physique — Vigueur
        </option>

        <option value="mental">
          Mental — Volonté
        </option>

        <option value="social">
          Social — Influence
        </option>

      </select>

    </label>


    <!-- MAÎTRISE -->

    <div class="label">
      Niveau de maîtrise
    </div>

    <div class="attribute">

      <span id="level-label">
        Novice +1
      </span>

      <div
        class="dots"
        id="level-dots"
      ></div>

    </div>


    <!-- DESCRIPTION -->

    <label class="field group">

      <span class="label">
        Description (facultative)
      </span>

      <textarea
        id="skill-description"
        class="input long"
        style="min-height:110px"
      ></textarea>

    </label>


    <p
      id="skill-error"
      class="error"
      role="alert"
    ></p>


    <button
      class="box primary"
      id="add-skill"
      type="button"
    >
      Ajouter la compétence
    </button>

  </div>


  <!-- RETOUR -->

  <div class="actions">

    <button
      class="box secondary"
      id="skills-done"
      type="button"
    >
      Retour au personnage
    </button>

  </div>

</section>


<!-- ======================================
     ATOUTS
     ====================================== -->

<section id="atouts" hidden>

  <div class="heading">

    <button
      class="back"
      id="atouts-back"
      type="button"
      aria-label="Retour"
    >
      ←
    </button>

    <h1>Atouts</h1>

  </div>


  <!-- ATOUTS ENREGISTRÉS -->

  <div
    id="atout-list"
    class="mise-cards"
  ></div>


  <!-- NOUVEL ATOUT -->

  <div class="group">

    <h2>Nouvel Atout</h2>

    <label class="field">

      <span class="label">
        Nom de l'Atout
      </span>

      <input
        id="atout-name"
        class="input"
        type="text"
        maxlength="100"
      >

    </label>


    <!-- RÉSERVE -->

    <label class="field">

      <span class="label">
        Réserve utilisée
      </span>

      <select
        id="atout-reserve"
        class="input"
      >

        <option value="physique">
          Vigueur
        </option>

        <option value="mental">
          Volonté
        </option>

        <option value="social">
          Influence
        </option>

      </select>

    </label>


    <!-- COÛT -->

    <label class="field">

      <span class="label">
        Coût fixe en PA
      </span>

      <input
        id="atout-cost"
        class="input"
        type="number"
        min="1"
        max="999"
        step="1"
        value="1"
      >

    </label>


    <!-- DESCRIPTION -->

    <label class="field">

      <span class="label">
        Description (facultative)
      </span>

      <textarea
        id="atout-description"
        class="input long"
        style="min-height:110px"
      ></textarea>

    </label>


    <p
      id="atout-error"
      class="error"
      role="alert"
    ></p>


    <button
      class="box primary"
      id="add-atout"
      type="button"
    >
      Ajouter l'Atout
    </button>

  </div>


  <!-- RETOUR -->

  <div class="actions">

    <button
      class="box secondary"
      id="atouts-done"
      type="button"
    >
      Retour au personnage
    </button>

  </div>

</section>


<!-- ======================================
     FICHE DU PERSONNAGE
     ====================================== -->

<section id="detail" hidden>

  <div class="heading">

    <button
      class="back"
      id="detail-back"
      type="button"
      aria-label="Retour à l'accueil"
    >
      ←
    </button>

    <h1>Personnage</h1>

  </div>


  <!-- PORTRAIT -->

  <img
    id="detail-portrait"
    class="portrait"
    alt="Portrait du personnage"
    hidden
  >


  <!-- NOM -->

  <div
    class="detail-name"
    id="detail-name"
  ></div>


  <!-- ATTRIBUTS -->

  <h2>Attributs</h2>

  <div id="detail-attrs"></div>


  <!-- RÉSERVES -->

  <h2>Réserves de PA</h2>

  <div id="detail-reserves"></div>


  <!-- COMPÉTENCES -->

  <h2>Compétences</h2>

  <div
    id="detail-skills"
    class="mise-cards"
  ></div>


  <!-- ATOUTS -->

  <h2>Atouts</h2>

  <div
    id="detail-atouts"
    class="mise-cards"
  ></div>


  <!-- HISTORIQUE -->

  <h2>Historique</h2>

  <p
    id="detail-history"
    class="detail-history"
  ></p>


  <!-- ACTIONS -->

  <div class="actions">

    <button
      class="box primary play-button"
      id="play"
      type="button"
    >
      Jouer ce personnage
    </button>

    <button
      class="box secondary"
      id="edit"
      type="button"
    >
      Modifier le personnage
    </button>

  </div>


  <button
    class="danger"
    id="delete-character"
    type="button"
  >
    Supprimer ce personnage
  </button>

</section>

</main>


<!-- ======================================
     APPLICATION
     ====================================== -->

<script>

(() => {

"use strict";


/* ========================================
   CONFIGURATION
   ======================================== */

const $ = id =>
  document.getElementById(id);

const KEY = "mise-app-characters-v1";

const ATTRS = [
  "physique",
  "mental",
  "social"
];

const ATTR_NAMES = {
  physique: "Physique",
  mental: "Mental",
  social: "Social"
};

const RESERVES = {
  physique: "Vigueur",
  mental: "Volonté",
  social: "Influence"
};

const NIVEAUX = [
  "Novice",
  "Confirmé",
  "Expert",
  "Maître"
];

const BONUS = [1, 2, 3, 5];

const SCREENS = [
  "home",
  "form",
  "skills",
  "atouts",
  "detail"
];

const clone = value =>
  JSON.parse(JSON.stringify(value));

const uid = () =>
  crypto.randomUUID();

const clamp = (value, min, max) =>
  Math.max(min, Math.min(max, value));

const baseMax = value =>
  value * 3 + 5;


/* ========================================
   ÉTAT DE L'APPLICATION
   ======================================== */

let personnages = [];

let brouillon = null;

let personnageSelectionne = null;

let niveauChoisi = 1;

let portraitEnAttente = null;

let supprimerPortrait = false;

let urlApercu = null;

let urlPortraitFiche = null;

let versionApercu = 0;

let versionFiche = 0;


/* ========================================
   CHARGEMENT DES PERSONNAGES
   ======================================== */

try {

  const donnees = JSON.parse(
    localStorage.getItem(KEY) || "[]"
  );

  if (Array.isArray(donnees)) {
    personnages = donnees;
  }

} catch {

  personnages = [];

}


/* ========================================
   SAUVEGARDE
   ======================================== */

function sauvegarder() {

  try {

    localStorage.setItem(
      KEY,
      JSON.stringify(personnages)
    );

    return true;

  } catch {

    return false;

  }

}


/* ========================================
   RÉSERVES ET BLESSURES
   ======================================== */

function maximumPA(personnage, attribut) {

  const blessures =
    personnage.wounds?.[attribut] || 0;

  return Math.max(
    0,
    baseMax(personnage[attribut]) -
    3 * blessures
  );

}


function preparerPersonnage(personnage) {

  if (!personnage.wounds) {

    personnage.wounds = {
      physique: 0,
      mental: 0,
      social: 0
    };

  }

  if (!personnage.pa) {
    personnage.pa = {};
  }

  if (!Array.isArray(personnage.skills)) {
    personnage.skills = [];
  }

  if (!Array.isArray(personnage.atouts)) {
    personnage.atouts = [];
  }

  if (typeof personnage.history !== "string") {
    personnage.history = "";
  }

  for (const attribut of ATTRS) {

    const blessures = Number(
      personnage.wounds[attribut]
    );

    personnage.wounds[attribut] =
      Number.isFinite(blessures)
        ? clamp(Math.trunc(blessures), 0, 20)
        : 0;

    const maximum = maximumPA(
      personnage,
      attribut
    );

    const disponibles = Number(
      personnage.pa[attribut]
    );

    personnage.pa[attribut] =
      personnage.pa[attribut] == null ||
      !Number.isFinite(disponibles)
        ? maximum
        : clamp(
            Math.trunc(disponibles),
            0,
            maximum
          );

  }

  return personnage;

}


/* ========================================
   PORTRAITS — INDEXEDDB
   ======================================== */

let promesseBase = null;


function ouvrirBaseImages() {

  if (!("indexedDB" in window)) {
    return Promise.resolve(null);
  }

  if (!promesseBase) {

    promesseBase = new Promise(resolve => {

      const requete = indexedDB.open(
        "mise-portraits-v1",
        1
      );

      requete.onupgradeneeded = () => {

        const base = requete.result;

        if (
          !base.objectStoreNames.contains("images")
        ) {
          base.createObjectStore("images");
        }

      };

      requete.onsuccess = () => {
        resolve(requete.result);
      };

      requete.onerror = () => {
        resolve(null);
      };

      requete.onblocked = () => {
        resolve(null);
      };

    });

  }

  return promesseBase;

}


async function lirePortrait(id) {

  const base = await ouvrirBaseImages();

  if (!base || !id) return null;

  return new Promise(resolve => {

    try {

      const transaction = base.transaction(
        "images",
        "readonly"
      );

      const requete = transaction
        .objectStore("images")
        .get(id);

      requete.onsuccess = () => {
        resolve(requete.result || null);
      };

      requete.onerror = () => {
        resolve(null);
      };

    } catch {

      resolve(null);

    }

  });

}


async function enregistrerPortrait(id, image) {

  const base = await ouvrirBaseImages();

  if (!base) {
    throw new Error(
      "Stockage des portraits indisponible"
    );
  }

  return new Promise((resolve, reject) => {

    try {

      const transaction = base.transaction(
        "images",
        "readwrite"
      );

      transaction
        .objectStore("images")
        .put(image, id);

      transaction.oncomplete = () => {
        resolve();
      };

      transaction.onerror = () => {
        reject(
          new Error(
            "Impossible d'enregistrer le portrait"
          )
        );
      };

    } catch (erreur) {

      reject(erreur);

    }

  });

}


async function effacerPortrait(id) {

  const base = await ouvrirBaseImages();

  if (!base) {
    throw new Error(
      "Stockage des portraits indisponible"
    );
  }

  return new Promise((resolve, reject) => {

    try {

      const transaction = base.transaction(
        "images",
        "readwrite"
      );

      transaction
        .objectStore("images")
        .delete(id);

      transaction.oncomplete = () => {
        resolve();
      };

      transaction.onerror = () => {
        reject(
          new Error(
            "Impossible d'effacer le portrait"
          )
        );
      };

    } catch (erreur) {

      reject(erreur);

    }

  });

}


/* ========================================
   AFFICHAGE DES IMAGES
   ======================================== */

function afficherImage(element, image, type) {

  const ancienneURL =
    type === "apercu"
      ? urlApercu
      : urlPortraitFiche;

  if (ancienneURL) {
    URL.revokeObjectURL(ancienneURL);
  }

  if (type === "apercu") {
    urlApercu = null;
  } else {
    urlPortraitFiche = null;
  }

  element.hidden = true;
  element.removeAttribute("src");

  if (!image) return;

  const nouvelleURL = URL.createObjectURL(
    image
  );

  element.src = nouvelleURL;
  element.hidden = false;

  if (type === "apercu") {
    urlApercu = nouvelleURL;
  } else {
    urlPortraitFiche = nouvelleURL;
  }

}


async function chargerApercu(id) {

  const version = ++versionApercu;

  const element = $("portrait-preview");

  afficherImage(element, null, "apercu");

  if (!id) return;

  const image = await lirePortrait(id);

  if (
    version !== versionApercu ||
    !brouillon ||
    brouillon.id !== id ||
    portraitEnAttente ||
    supprimerPortrait
  ) {
    return;
  }

  afficherImage(element, image, "apercu");

}


async function chargerPortraitFiche(id) {

  const version = ++versionFiche;

  const element = $("detail-portrait");

  afficherImage(element, null, "fiche");

  if (!id) return;

  const image = await lirePortrait(id);

  if (
    version !== versionFiche ||
    personnageSelectionne !== id
  ) {
    return;
  }

  afficherImage(element, image, "fiche");

}


/* ========================================
   NAVIGATION
   ======================================== */

function afficherPage(page) {

  for (const nom of SCREENS) {
    $(nom).hidden = nom !== page;
  }

  window.scrollTo(0, 0);

  if (page === "home") {
    afficherAccueil();
  }

  if (page === "detail") {
    afficherFiche();
  }

  if (page === "skills") {
    afficherCompetences();
  }

  if (page === "atouts") {
    afficherAtouts();
  }

}


/* ========================================
   CERCLES DES ATTRIBUTS
   ======================================== */

function afficherCercles(
  elementId,
  valeur,
  modifier,
  nom
) {

  const element = $(elementId);

  element.replaceChildren();

  for (let n = 1; n <= 4; n++) {

    const bouton = document.createElement(
      "button"
    );

    bouton.type = "button";

    bouton.className =
      "dot" +
      (n <= valeur ? " active" : "");

    bouton.setAttribute(
      "aria-label",
      nom + " : " + n + " sur 4"
    );

    bouton.setAttribute(
      "aria-pressed",
      String(n <= valeur)
    );

    bouton.onclick = () => modifier(n);

    element.append(bouton);

  }

}


/* ========================================
   ACCUEIL
   ======================================== */

function afficherAccueil() {

  const conteneur = $("cards");

  conteneur.replaceChildren();

  for (const personnage of personnages) {

    const bouton = document.createElement(
      "button"
    );

    bouton.type = "button";

    bouton.className = "box card";

    bouton.textContent = personnage.name;

    bouton.onclick = () => {

      personnageSelectionne = personnage.id;

      afficherPage("detail");

    };

    conteneur.append(bouton);

  }

}


/* ========================================
   NOUVEAU PERSONNAGE
   ======================================== */

function nouveauPersonnage() {

  return {

    id: null,

    name: "",

    physique: 1,
    mental: 1,
    social: 1,

    history: "",

    skills: [],
    atouts: [],

    wounds: {
      physique: 0,
      mental: 0,
      social: 0
    },

    pa: {
      physique: 8,
      mental: 8,
      social: 8
    }

  };

}


/* ========================================
   ÉDITION
   ======================================== */

function ouvrirEdition(personnage) {

  brouillon = preparerPersonnage(
    clone(personnage)
  );

  portraitEnAttente = null;

  supprimerPortrait = false;

  $("portrait-file").value = "";

  $("name").value = brouillon.name;

  $("history").value = brouillon.history;

  $("form-heading").textContent =
    brouillon.id
      ? "Modifier le personnage"
      : "Nouveau personnage";

  $("form-error").textContent = "";

  afficherAttributs();

  actualiserCompteurs();

  afficherPage("form");

  chargerApercu(brouillon.id);

}


function afficherAttributs() {

  for (const attribut of ATTRS) {

    afficherCercles(
      "dots-" + attribut,

      brouillon[attribut],

      valeur => {

        brouillon[attribut] = valeur;

        afficherAttributs();

      },

      attribut
    );

  }

}


function synchroniserChamps() {

  brouillon.name = $("name").value;

  brouillon.history = $("history").value;

}


function actualiserCompteurs() {

  const competences = brouillon.skills.length;

  const atouts = brouillon.atouts.length;

  $("skill-count").textContent =
    competences
      ? competences +
        " compétence" +
        (competences > 1 ? "s" : "") +
        " enregistrée" +
        (competences > 1 ? "s" : "")
      : "Aucune compétence enregistrée";

  $("atout-count").textContent =
    atouts
      ? atouts +
        " Atout" +
        (atouts > 1 ? "s" : "") +
        " enregistré" +
        (atouts > 1 ? "s" : "")
      : "Aucun Atout enregistré";

}


/* ========================================
   CRÉATION D'UN CARTOUCHE
   ======================================== */

function creerCartouche(
  nom,
  informations,
  description = ""
) {

  const carte = document.createElement("div");
  carte.className = "mise-card";

  const titre = document.createElement("div");
  titre.className = "mise-card-title";
  titre.textContent = nom;

  const meta = document.createElement("p");
  meta.className = "mise-card-meta";
  meta.textContent = informations;

  carte.append(titre, meta);

  if (description) {

    const texte = document.createElement("p");
    texte.className = "mise-card-description";
    texte.textContent = description;

    carte.append(texte);

  }

  return carte;

}


/* ========================================
   LISTE VIDE
   ======================================== */

function afficherListeVide(conteneur, texte) {

  const paragraphe = document.createElement("p");

  paragraphe.className = "mise-empty subtle";

  paragraphe.textContent = texte;

  conteneur.append(paragraphe);

}


/* ========================================
   ASSOCIATION COMPÉTENCE / CARACTÉRISTIQUE
   ======================================== */

function reserveCompetence(competence) {

  /*
    Les compétences existantes peuvent ne pas
    posséder de réserve.

    Ne jamais leur attribuer arbitrairement
    une valeur par défaut.
  */

  if (
    competence &&
    ATTRS.includes(competence.reserve)
  ) {
    return competence.reserve;
  }

  return null;

}


function informationsCompetence(competence) {

  const niveau =
    NIVEAUX[competence.level - 1] ||
    "Non défini";

  const bonus =
    BONUS[competence.level - 1] ?? 0;

  const reserve = reserveCompetence(competence);

  const association = reserve
    ? ATTR_NAMES[reserve] +
      " · " +
      RESERVES[reserve]
    : "Caractéristique à définir";

  return (
    niveau +
    " +" +
    bonus +
    " · " +
    association
  );

}


/* ========================================
   COMPÉTENCES — ÉDITEUR
   ======================================== */

function afficherCompetences() {

  const conteneur = $("skill-list");

  conteneur.replaceChildren();

  if (!brouillon.skills.length) {

    afficherListeVide(
      conteneur,
      "Aucune compétence enregistrée."
    );

  }

  for (const competence of brouillon.skills) {

    const carte = creerCartouche(
      competence.name,
      informationsCompetence(competence),
      competence.description || ""
    );


    /*
      Pour les compétences anciennes,
      il est possible de compléter
      la caractéristique sans les recréer.

      Cette possibilité permet également
      de corriger une association erronée.
    */

    const actions = document.createElement("div");

    actions.className = "mise-card-actions";


    const choix = document.createElement("select");

    choix.className = "mise-card-select";

    choix.setAttribute(
      "aria-label",
      "Caractéristique de " + competence.name
    );


    const options = [
      ["", "Choisir une caractéristique"],
      ["physique", "Physique — Vigueur"],
      ["mental", "Mental — Volonté"],
      ["social", "Social — Influence"]
    ];


    for (const [valeur, texte] of options) {

      const option = document.createElement("option");

      option.value = valeur;
      option.textContent = texte;

      choix.append(option);

    }


    choix.value = reserveCompetence(competence) || "";


    choix.onchange = () => {

      if (!ATTRS.includes(choix.value)) {
        return;
      }

      competence.reserve = choix.value;

      afficherCompetences();

    };


    const retirer = document.createElement("button");

    retirer.type = "button";
    retirer.className = "small";
    retirer.textContent = "Retirer";

    retirer.setAttribute(
      "aria-label",
      "Retirer " + competence.name
    );


    retirer.onclick = () => {

      brouillon.skills =
        brouillon.skills.filter(
          element => element.id !== competence.id
        );

      afficherCompetences();

    };


    actions.append(choix, retirer);

    carte.append(actions);

    conteneur.append(carte);

  }

  afficherNiveau();

}


/* ========================================
   NIVEAU DE MAÎTRISE
   ======================================== */

function afficherNiveau() {

  afficherCercles(

    "level-dots",

    niveauChoisi,

    valeur => {

      niveauChoisi = valeur;

      afficherNiveau();

    },

    "Niveau de maîtrise"

  );

  $("level-label").textContent =
    NIVEAUX[niveauChoisi - 1] +
    " +" +
    BONUS[niveauChoisi - 1];

}


/* ========================================
   ATOUTS — ÉDITEUR
   ======================================== */

function afficherAtouts() {

  const conteneur = $("atout-list");

  conteneur.replaceChildren();

  if (!brouillon.atouts.length) {

    afficherListeVide(
      conteneur,
      "Aucun Atout enregistré."
    );

  }

  for (const atout of brouillon.atouts) {

    const carte = creerCartouche(
      atout.name,

      atout.cost +
      " PA · " +
      (RESERVES[atout.reserve] || "Réserve inconnue"),

      atout.description || ""
    );


    const actions = document.createElement("div");

    actions.className = "mise-card-actions";


    const retirer = document.createElement("button");

    retirer.type = "button";
    retirer.className = "small";
    retirer.textContent = "Retirer";

    retirer.setAttribute(
      "aria-label",
      "Retirer " + atout.name
    );


    retirer.onclick = () => {

      brouillon.atouts =
        brouillon.atouts.filter(
          element => element.id !== atout.id
        );

      afficherAtouts();

    };


    actions.append(retirer);

    carte.append(actions);

    conteneur.append(carte);

  }

}


/* ========================================
   LIGNES DE LA FICHE
   ======================================== */

function ajouterLigne(
  conteneur,
  libelle,
  valeur
) {

  const ligne = document.createElement("div");

  ligne.className = "detail-row";

  const titre = document.createElement("span");

  titre.textContent = libelle;

  const donnees = document.createElement("strong");

  donnees.textContent = valeur;

  ligne.append(titre, donnees);

  conteneur.append(ligne);

}


/* ========================================
   PERSONNAGE SÉLECTIONNÉ
   ======================================== */

function personnageActuel() {

  return personnages.find(
    personnage =>
      personnage.id === personnageSelectionne
  );

}


/* ========================================
   FICHE DU PERSONNAGE
   ======================================== */

function afficherFiche() {

  const personnage = personnageActuel();

  if (!personnage) {

    afficherPage("home");

    return;

  }

  preparerPersonnage(personnage);

  $("detail-name").textContent =
    personnage.name;

  chargerPortraitFiche(personnage.id);


  /* ATTRIBUTS */

  const zoneAttributs = $("detail-attrs");

  zoneAttributs.replaceChildren();


  /* RÉSERVES */

  const zoneReserves = $("detail-reserves");

  zoneReserves.replaceChildren();


  for (const attribut of ATTRS) {

    ajouterLigne(
      zoneAttributs,
      ATTR_NAMES[attribut],
      String(personnage[attribut])
    );

    ajouterLigne(
      zoneReserves,
      RESERVES[attribut],
      personnage.pa[attribut] +
      " / " +
      maximumPA(personnage, attribut) +
      " PA"
    );

  }


  /* COMPÉTENCES */

  const zoneCompetences = $("detail-skills");

  zoneCompetences.replaceChildren();

  if (!personnage.skills.length) {

    afficherListeVide(
      zoneCompetences,
      "Aucune compétence."
    );

  }

  for (const competence of personnage.skills) {

    const carte = creerCartouche(
      competence.name,
      informationsCompetence(competence),
      competence.description || ""
    );

    zoneCompetences.append(carte);

  }


  /* ATOUTS */

  const zoneAtouts = $("detail-atouts");

  zoneAtouts.replaceChildren();

  if (!personnage.atouts.length) {

    afficherListeVide(
      zoneAtouts,
      "Aucun Atout."
    );

  }

  for (const atout of personnage.atouts) {

    const carte = creerCartouche(
      atout.name,

      atout.cost +
      " PA · " +
      (RESERVES[atout.reserve] || "Réserve inconnue"),

      atout.description || ""
    );

    zoneAtouts.append(carte);

  }


  /* HISTORIQUE */

  $("detail-history").textContent =
    personnage.history || "Aucun historique.";

}


/* ========================================
   ÉVÉNEMENTS
   ======================================== */


/* CRÉATION */

$("create").onclick = () => {

  ouvrirEdition(
    nouveauPersonnage()
  );

};


/* ANNULATION */

$("form-back").onclick =
$("cancel").onclick = () => {

  afficherPage(
    brouillon.id ? "detail" : "home"
  );

};


/* ========================================
   PORTRAITS
   ======================================== */

$("portrait-file").onchange = () => {

  const fichier =
    $("portrait-file").files[0];

  if (!fichier) return;

  if (!fichier.type.startsWith("image/")) {

    $("form-error").textContent =
      "Choisissez un fichier image.";

    return;

  }

  versionApercu++;

  portraitEnAttente = fichier;

  supprimerPortrait = false;

  afficherImage(
    $("portrait-preview"),
    fichier,
    "apercu"
  );

  $("form-error").textContent = "";

};


$("portrait-remove").onclick = () => {

  versionApercu++;

  portraitEnAttente = null;

  supprimerPortrait = true;

  $("portrait-file").value = "";

  afficherImage(
    $("portrait-preview"),
    null,
    "apercu"
  );

};


/* ========================================
   OUVRIR LES COMPÉTENCES
   ======================================== */

$("open-skills").onclick = () => {

  synchroniserChamps();

  niveauChoisi = 1;

  $("skill-name").value = "";

  $("skill-reserve").value = "";

  $("skill-description").value = "";

  $("skill-error").textContent = "";

  afficherPage("skills");

};


/* ========================================
   RETOUR DES COMPÉTENCES
   ======================================== */

$("skills-back").onclick =
$("skills-done").onclick = () => {

  actualiserCompteurs();

  afficherPage("form");

};


/* ========================================
   AJOUTER UNE COMPÉTENCE
   ======================================== */

$("add-skill").onclick = () => {

  const nom =
    $("skill-name").value.trim();

  const reserve =
    $("skill-reserve").value;


  if (!nom) {

    $("skill-error").textContent =
      "Indiquez un nom de compétence.";

    return;

  }


  if (!ATTRS.includes(reserve)) {

    $("skill-error").textContent =
      "Choisissez la caractéristique associée.";

    return;

  }


  const existe = brouillon.skills.some(
    competence =>
      competence.name.toLocaleLowerCase("fr") ===
      nom.toLocaleLowerCase("fr")
  );


  if (existe) {

    $("skill-error").textContent =
      "Cette compétence existe déjà.";

    return;

  }


  brouillon.skills.push({

    id: uid(),

    name: nom,

    level: niveauChoisi,

    /*
      La caractéristique associée
      détermine la réserve de PA.
    */

    reserve: reserve,

    description:
      $("skill-description").value.trim()

  });


  $("skill-name").value = "";

  $("skill-reserve").value = "";

  $("skill-description").value = "";

  $("skill-error").textContent = "";

  niveauChoisi = 1;

  afficherCompetences();

};


/* ========================================
   OUVRIR LES ATOUTS
   ======================================== */

$("open-atouts").onclick = () => {

  synchroniserChamps();

  $("atout-name").value = "";

  $("atout-description").value = "";

  $("atout-reserve").value = "physique";

  $("atout-cost").value = "1";

  $("atout-error").textContent = "";

  afficherPage("atouts");

};


/* ========================================
   RETOUR DES ATOUTS
   ======================================== */

$("atouts-back").onclick =
$("atouts-done").onclick = () => {

  actualiserCompteurs();

  afficherPage("form");

};


/* ========================================
   AJOUTER UN ATOUT
   ======================================== */

$("add-atout").onclick = () => {

  const nom =
    $("atout-name").value.trim();

  const cout =
    Number($("atout-cost").value);

  const reserve =
    $("atout-reserve").value;


  if (!nom) {

    $("atout-error").textContent =
      "Indiquez un nom d'Atout.";

    return;

  }


  if (
    !Number.isInteger(cout) ||
    cout < 1 ||
    cout > 999
  ) {

    $("atout-error").textContent =
      "Indiquez un coût entier entre 1 et 999 PA.";

    return;

  }


  if (!ATTRS.includes(reserve)) {

    $("atout-error").textContent =
      "Sélectionnez une réserve valide.";

    return;

  }


  const existe = brouillon.atouts.some(
    atout =>
      atout.name.toLocaleLowerCase("fr") ===
      nom.toLocaleLowerCase("fr")
  );


  if (existe) {

    $("atout-error").textContent =
      "Cet Atout existe déjà.";

    return;

  }


  brouillon.atouts.push({

    id: uid(),

    name: nom,

    cost: cout,

    reserve: reserve,

    description:
      $("atout-description").value.trim()

  });


  $("atout-name").value = "";

  $("atout-description").value = "";

  $("atout-cost").value = "1";

  $("atout-error").textContent = "";

  afficherAtouts();

};


/* ========================================
   ENREGISTRER LE PERSONNAGE
   ======================================== */

$("save").onclick = async () => {

  synchroniserChamps();

  brouillon.name =
    brouillon.name.trim();


  if (!brouillon.name) {

    $("form-error").textContent =
      "Indiquez le nom du personnage.";

    return;

  }


  const nouveau = !brouillon.id;


  /*
    Un nouveau personnage commence
    avec toutes ses réserves pleines.

    Les personnages existants
    conservent leurs PA disponibles.
  */

  if (nouveau) {

    brouillon.id = uid();

    for (const attribut of ATTRS) {

      brouillon.pa[attribut] =
        maximumPA(brouillon, attribut);

    }

  }


  preparerPersonnage(brouillon);


  const anciens = personnages;


  if (!nouveau) {

    for (const attribut of ATTRS) {

      brouillon.pa[attribut] = Math.min(
        brouillon.pa[attribut],
        maximumPA(brouillon, attribut)
      );

    }

  }


  const nouveaux = [

    ...personnages.filter(
      personnage =>
        personnage.id !== brouillon.id
    ),

    clone(brouillon)

  ];


  personnages = nouveaux;


  if (!sauvegarder()) {

    personnages = anciens;

    if (nouveau) {
      brouillon.id = null;
    }

    $("form-error").textContent =
      "Impossible de sauvegarder sur cet appareil.";

    return;

  }


  const bouton = $("save");

  bouton.disabled = true;

  let erreurPortrait = false;


  try {

    if (supprimerPortrait) {

      await effacerPortrait(
        brouillon.id
      );

    } else if (portraitEnAttente) {

      await enregistrerPortrait(
        brouillon.id,
        portraitEnAttente
      );

    }

  } catch {

    erreurPortrait = true;

  } finally {

    bouton.disabled = false;

  }


  personnageSelectionne = brouillon.id;

  afficherPage("detail");


  if (erreurPortrait) {

    alert(
      "Le personnage a été enregistré, " +
      "mais le portrait n'a pas pu être sauvegardé."
    );

  }

};


/* ========================================
   RETOUR À L'ACCUEIL
   ======================================== */

$("detail-back").onclick = () => {

  afficherPage("home");

};


/* ========================================
   MODIFIER LE PERSONNAGE
   ======================================== */

$("edit").onclick = () => {

  const personnage =
    personnageActuel();

  if (personnage) {

    ouvrirEdition(personnage);

  }

};


/* ========================================
   SUPPRIMER LE PERSONNAGE
   ======================================== */

$("delete-character").onclick = async () => {

  const personnage =
    personnageActuel();

  if (!personnage) return;


  const confirmation = confirm(
    "Supprimer définitivement « " +
    personnage.name +
    " » ?\n\nCette action est irréversible."
  );

  if (!confirmation) return;


  const anciens = personnages;

  personnages = personnages.filter(
    element =>
      element.id !== personnage.id
  );


  if (!sauvegarder()) {

    personnages = anciens;

    alert(
      "Impossible de supprimer le personnage."
    );

    return;

  }


  try {

    await effacerPortrait(
      personnage.id
    );

  } catch (erreur) {

    console.warn(
      "Le portrait n'a pas pu être effacé.",
      erreur
    );

  }


  personnageSelectionne = null;

  afficherPage("home");

};


/* ========================================
   JOUER CE PERSONNAGE
   ======================================== */

$("play").onclick = () => {

  const personnage =
    personnageActuel();

  if (!personnage) return;


  const adresse = new URL(
    "jeu.html",
    window.location.href
  );

  adresse.searchParams.set(
    "id",
    personnage.id
  );

  window.location.href =
    adresse.toString();

};


/* ========================================
   DÉMARRAGE
   ======================================== */

const parametres = new URLSearchParams(
  window.location.search
);

const idRetour = parametres.get("id");


if (
  idRetour &&
  personnages.some(
    personnage => personnage.id === idRetour
  )
) {

  personnageSelectionne = idRetour;

  afficherPage("detail");

} else {

  afficherPage("home");

}

})();

</script>
